name: CI
on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      
      - name: Venv Environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run static code analisis flake8
        run: |
          source venv/bin/activate
          python -m unittest tests/test_main_v1.py
          flake8 my_app/main_v1_2.py

      - name: Run static code analisis mypy
        run: |
          source venv/bin/activate
          mypy my_app --config-file mypi.ini
          

